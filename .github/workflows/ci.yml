name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: C host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: make test-host

  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable --no-self-update
      - run: make rs-test

  ros2:
    name: ROS2 planner (${{ matrix.ros_distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, lyrical]
    env:
      VI_ROS_DISTRO: ${{ matrix.ros_distro }}
    steps:
      - uses: actions/checkout@v6
      - run: make ros2-docker
      - run: make ros2-test
      - name: Verify installed planner
        run: test -x vi_ros2_ws/install/lib/vi_planner/vi_planner
