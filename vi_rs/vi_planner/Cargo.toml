[package]
name = "vi_planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

# 空の [workspace] で vi_rs ワークスペースから隔離する (path 依存が workspace を
# 引き込まないように)。
[workspace]

[dependencies]
anyhow  = "1"
# main.rs が action コールバック (rclrs の futures エグゼキュータ) と
# 計画/追従スレッドを橋渡しする oneshot チャネルに使う。
futures = "0.3"
vi_lib = { path = "../vi_lib" }

# ROS deps。colcon-ros-cargo の生成 config が [patch.crates-io] でローカル
# ビルド済みクレートへ差し替える。nav2_msgs は Docker の ros2_rust
# ワークスペースでソースビルドして Rust バインディングを得る。
rclrs         = "*"
nav_msgs      = "*"
geometry_msgs = "*"
sensor_msgs   = "*"
nav2_msgs     = "*"
