[package]
name = "vi_bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# u64 (本家忠実) ソルバ群。bench_summary / bench_map / criterion ベンチの本体。
# bitboard ベンチ (benches/bitboard.rs) は vi_lib::bitboard を参照する。
vi_lib = { path = "../vi_lib" }
clap         = { workspace = true }

[features]
# schur_bench --gpu (vi_lib::solvers::schur_gpu) を有効化する。
gpu = ["vi_lib/cuda"]

[dev-dependencies]
# criterion ベンチ (benches/) 専用。src からは参照しない。
criterion = { workspace = true }

[[bench]]
name = "reference"
harness = false

[[bench]]
name = "frontier"
harness = false

[[bench]]
name = "block_pyramid"
harness = false

[[bench]]
name = "bitboard"
harness = false

[[bench]]
name = "stream_mimic"
harness = false
