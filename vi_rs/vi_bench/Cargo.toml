[package]
name = "vi_bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# u64 (本家忠実) ソルバ群。bench_summary / bench_map / criterion ベンチの本体。
# bitboard ベンチ (benches/bitboard.rs) は vi_reference::bitboard を参照する。
vi_reference = { path = "../vi_reference" }
criterion    = { workspace = true }
clap         = { workspace = true }

[[bench]]
name = "reference"
harness = false

[[bench]]
name = "frontier"
harness = false

[[bench]]
name = "block_pyramid"
harness = false

[[bench]]
name = "bitboard"
harness = false

[[bench]]
name = "stream_mimic"
harness = false
